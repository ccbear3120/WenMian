name: 每日更新汇率

on:
  schedule:
    # 明斯克时间每小时第 10 分钟更新，避开整点负载高峰
    - cron: '10 * * * *'
      timezone: Europe/Minsk
    # 临时测试：明斯克 21:10
    - cron: '10 21 * * *'
      timezone: Europe/Minsk
  workflow_dispatch:  # 允许手动在 Actions 页面点击触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取汇率并生成 rates.json
        run: python .github/scripts/update_rates.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rate/rates.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: 更新汇率快照 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          else
            echo "数据无变化，跳过提交"
          fi

