<!DOCTYPE html> <html lang="zh-CN"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>白俄汇率速查</title> <style>:root{ --primary:#d4242e; --primary-dark:#b01b24; --ink:#1f2430; --muted:#6b7280; --line:#e8eaef; --bg:#f5f6f8; --card:#ffffff; } *{box-sizing:border-box;margin:0;padding:0} body{ font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg);color:var(--ink);min-height:100vh; display:flex;align-items:flex-start;justify-content:center;padding:28px 14px; } .wrap{width:100%;max-width:460px} .header{text-align:center;margin-bottom:20px} .header h1{font-size:24px;letter-spacing:.5px} .header p{margin-top:8px;color:var(--muted);font-size:13px} .card{ background:var(--card);border-radius:18px;padding:20px; box-shadow:0 8px 30px rgba(31,36,48,.08);border:1px solid var(--line); } .btn-row{display:flex;gap:10px} .btn{ flex:1;padding:15px 6px;border:none;border-radius:12px; background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:#fff;font-size:13px;font-weight:700;letter-spacing:0;cursor:pointer; white-space:nowrap;transition:transform .1s ease,opacity .2s ease; } .btn:active{transform:scale(.98)} .btn:disabled{opacity:.6;cursor:not-allowed} .btn-blue{background:linear-gradient(135deg,#3b82f6,#2563eb)} .status-row{display:flex;gap:10px} .status{flex:1;font-size:12px;text-align:center;line-height:1.35;min-height:0} .status.error{color:#b91c1c} .status.info{color:var(--muted)} .results-row{display:flex;gap:10px;margin-top:6px;align-items:stretch} .result{ display:none;flex:1;min-width:0;margin-top:0;padding:14px 9px;border-radius:14px; background:linear-gradient(135deg,#fff5f5,#fff);border:1px solid #f7d5d7;text-align:center; } .result.show{display:block;animation:fade .35s ease} @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}} .result.myfin{background:linear-gradient(135deg,#f5f9ff,#fff);border-color:#cfe0ff} .res-title{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:700;color:var(--ink);margin-bottom:10px} .block-dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none} .rate-big{font-size:26px;font-weight:800;color:var(--primary);line-height:1.2} .myfin .rate-big{color:#2563eb} .rate-expr{margin-top:6px;font-size:12px;color:var(--ink);font-weight:600} .rate-inverse{margin-top:8px;font-size:11px;color:var(--muted)} .meta{ margin-top:12px;padding-top:10px;border-top:1px solid #f0dede; font-size:10px;color:var(--muted);display:flex;flex-direction:column;gap:4px;align-items:center; } .trend-head{display:flex;align-items:center;justify-content:space-between;margin-top:20px;margin-bottom:6px} .trend-head .cnt{font-size:12px;color:var(--muted)} .clear-btn{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:5px 12px;font-size:12px;cursor:pointer;white-space:nowrap} .clear-btn:active{background:#f2f3f5} .clear-btn.confirming{border-color:#d4242e;color:#d4242e;background:#fff0f1;font-weight:600} .chart-wrap{width:100%;overflow-x:auto;position:relative} #trendChart{width:100%;height:300px;display:block} .legend{display:flex;gap:16px;justify-content:center;margin-top:10px;font-size:12px;color:var(--muted)} .legend i{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px} .chart-tip{text-align:center;font-size:11px;color:#9aa0aa;margin-top:6px} .detail-title{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink)} .detail-list{margin-top:8px;max-height:260px;overflow-y:auto} .detail-row{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:8px;background:#fafbfc;margin-bottom:6px;font-size:12px;border:2px solid transparent;transition:background .25s,border-color .25s} .detail-row .d-left{display:flex;flex-direction:column;gap:3px} .detail-row .d-time{color:var(--muted)} .detail-row .d-src{font-weight:600} .detail-row .d-src.up{color:var(--primary)} .detail-row .d-src.mf{color:#2563eb} .detail-row .d-rate{font-size:15px;font-weight:700;color:var(--ink)} .detail-row.highlight{background:#fff6d6;border-color:#f0b429;animation:hlpulse 1.1s ease} @keyframes hlpulse{0%{background:#ffe89a}100%{background:#fff6d6}} .empty-tip{text-align:center;color:#9aa0aa;font-size:13px;padding:36px 10px} .note{margin-top:20px;font-size:11px;color:#9aa0aa;line-height:1.7;text-align:center} .spin{ display:inline-block;width:13px;height:13px;border:2px solid rgba(31,36,48,.2); border-top-color:#6b7280;border-radius:50%;animation:spin .7s linear infinite; vertical-align:-2px;margin-right:5px; } @keyframes spin{to{transform:rotate(360deg)}}</style> </head> <body> <div class="wrap"> <div class="header"> <h1>白俄汇率速查</h1> </div> <div class="card"> <div class="btn-row"> <button class="btn" id="btn">查询银联 CNY/BYN</button> <button class="btn btn-blue" id="btnMyfin">查询Myfin USD/BYN</button> </div> <div class="status-row"> <div class="status info" id="status"></div> <div class="status info" id="statusMyfin"></div> </div> <div class="results-row"> <div class="result" id="result"> <div class="res-title"><span class="block-dot" style="background:#d4242e"></span>银联 CNY/BYN</div> <div class="rate-big" id="rateBig">—</div> <div class="rate-expr" id="rateExpr">—</div> <div class="rate-inverse" id="rateInverse">—</div> <div class="meta"> <span id="metaDate">数据日期：—</span> <span id="metaSrc">来源：中国银联</span> </div> </div> <div class="result myfin" id="resultMyfin"> <div class="res-title"><span class="block-dot" style="background:#2563eb"></span>Myfin USD/BYN</div> <div class="rate-big" id="myfinBig">—</div> <div class="rate-expr" id="myfinExpr">—</div> <div class="rate-inverse" id="myfinInverse">—</div> <div class="meta"> <span id="myfinDate">报价日期：—</span> <span>来源：Myfin</span> </div> </div> </div> <div class="trend-head"> <span class="cnt" id="recCount">共 0 条记录</span> <button class="clear-btn" id="btnClear">清空</button> </div> <div class="chart-wrap"> <canvas id="trendChart"></canvas> </div> <div class="legend"> <span><i style="background:#d4242e"></i>银联 CNY/BYN（左轴）</span> <span><i style="background:#2563eb"></i>Myfin USD/BYN（右轴）</span> </div> <div class="chart-tip">点击图上的点，可定位到下方对应记录</div> <div class="detail-title">记录明细</div> <div class="detail-list" id="detailList"></div> </div> <div class="note"> 每次查询成功的数据自动保存在本机，仅用于绘制趋势图。<br> <span style="display:inline-block;margin-top:8px;font-weight:600;color:#8a9099">@文文制作</span> </div> </div> <script>(function(){var $=function(id){return document.getElementById(id);};var inApp= !!window.AndroidBridge;var isStatic=false;var staticData=null;function bridgeCall(method){return new Promise(function(resolve,reject){var cb='cb_'+Date.now()+'_'+Math.floor(Math.random()*100000);window[cb]=function(payload){try{resolve(typeof payload==='string'?JSON.parse(payload):payload);}catch(e){reject(e);}delete window[cb];};AndroidBridge[method](cb);});}function loadStatic(){if(staticData)return Promise.resolve(staticData);return fetch('rates.json?t='+Date.now()).then(function(r){if(!r.ok)throw new Error('无法读取汇率数据文件');return r.json();}).then(function(d){staticData=d;return d;});}function apiQueryUnionPay(){if(inApp)return bridgeCall('queryUnionPay');if(isStatic)return loadStatic().then(function(d){var u=d.unionpay;if(!u|| !u.rate)throw new Error('暂无银联数据');return{rate:u.rate,inverse:u.inverse||1/u.rate,dataDate:u.dataDate||'',error:u.error};});return fetch('/api/rate').then(function(r){return r.json();});}function apiQueryMyfin(){if(inApp)return bridgeCall('queryMyfin');if(isStatic)return loadStatic().then(function(d){var m=d.myfin;if(!m|| !m.rate)throw new Error((m&&m.error)||'暂无 Myfin 数据');return{rate:m.rate,inverse:m.inverse||1/m.rate,quoteDate:m.quoteDate||'',error:m.error};});return fetch('/api/myfin').then(function(r){return r.json();});}function apiGetRecords(){try{if(inApp){var raw=AndroidBridge.getRecords();return typeof raw==='string'?JSON.parse(raw):(raw||[]);}return JSON.parse(localStorage.getItem('rate_records')||'[]');}catch(e){return[];}}function apiSaveRecord(source,rate,date,time){if(inApp){AndroidBridge.saveRecord(source,rate,date,time);return;}var arr=apiGetRecords();for(var i=arr.length-1;i>=0;i--){if(arr[i].source===source){if(Math.abs(Number(arr[i].rate)-Number(rate))<1e-9)return;break;}}arr.push({source:source,rate:Number(rate),date:date||'',time:time});if(arr.length>200)arr=arr.slice(-200);try{localStorage.setItem('rate_records',JSON.stringify(arr));}catch(e){}}function apiClearRecords(){if(inApp){AndroidBridge.clearRecords();return;}localStorage.removeItem('rate_records');}function nowTimeStr(){var d=new Date();function p(n){return n<10?'0'+n:''+n;}return p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());}function round3(v){return Math.round((Number(v)+1e-9)*1000)/1000;}var btn=$('btn'),statusEl=$('status'),result=$('result');btn.addEventListener('click',function(){btn.disabled=true;result.classList.remove('show');statusEl.className='status info';statusEl.innerHTML='<span class="spin"></span>正在查询…';apiQueryUnionPay().then(function(d){if(d.error)throw new Error(d.error);var rate=round3(d.rate);var inverse=round3(1/rate);$('rateBig').textContent=rate.toFixed(3);$('rateExpr').textContent='1 BYN = '+rate.toFixed(3)+' CNY';$('rateInverse').textContent='反向：1 CNY ≈ '+inverse.toFixed(3)+' BYN';$('metaDate').textContent='数据日期：'+String(d.dataDate).replace(/(\d{4})(\d{2})(\d{2})/,'$1-$2-$3');$('metaSrc').textContent='来源：中国银联';statusEl.textContent='';result.classList.add('show');apiSaveRecord('unionpay',rate,d.dataDate,nowTimeStr());loadRecords();}).catch(function(err){statusEl.className='status error';statusEl.textContent='查询失败：'+(err.message||'网络异常');}).finally(function(){btn.disabled=false;});});var btnMyfin=$('btnMyfin'),statusMyfin=$('statusMyfin'),resultMyfin=$('resultMyfin');btnMyfin.addEventListener('click',function(){btnMyfin.disabled=true;resultMyfin.classList.remove('show');statusMyfin.className='status info';statusMyfin.innerHTML='<span class="spin"></span>正在获取…';apiQueryMyfin().then(function(d){if(d.error)throw new Error(d.error);$('myfinBig').textContent=d.rate;$('myfinExpr').textContent='1 USD = '+d.rate+' BYN';$('myfinInverse').textContent='反向：1 BYN ≈ '+d.inverse+' USD';$('myfinDate').textContent='报价日期：'+d.quoteDate;statusMyfin.textContent='';resultMyfin.classList.add('show');apiSaveRecord('myfin',d.rate,d.quoteDate,nowTimeStr());loadRecords();}).catch(function(err){statusMyfin.className='status error';statusMyfin.textContent='获取失败：'+(err.message||'网络异常');}).finally(function(){btnMyfin.disabled=false;});});var records=[];var chartPoints=[];function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}function loadRecords(){records=apiGetRecords();$('recCount').textContent='共 '+records.length+' 条记录';drawChart();renderDetail();}var clearArmed=false,clearTimer=null;$('btnClear').addEventListener('click',function(){var btn=this;if(!clearArmed){clearArmed=true;btn.textContent='再点一次确认';btn.classList.add('confirming');clearTimeout(clearTimer);clearTimer=setTimeout(function(){clearArmed=false;btn.textContent='清空';btn.classList.remove('confirming');},3000);return;}clearTimeout(clearTimer);clearArmed=false;btn.textContent='清空';btn.classList.remove('confirming');apiClearRecords();loadRecords();});function renderDetail(){var box=$('detailList');if(!records||records.length===0){box.innerHTML='<div class="empty-tip" style="padding:18px 10px">暂无记录</div>';return;}var html='';for(var i=records.length-1;i>=0;i--){var r=records[i];var isUp=r.source==='unionpay';var srcTxt=isUp?'银联 CNY→BYN':'Myfin USD→BYN';html+='<div class="detail-row" id="row_'+i+'" data-gi="'+i+'">'+'<div class="d-left">'+'<span class="d-src '+(isUp?'up':'mf')+'">'+srcTxt+'</span>'+'<span class="d-time">'+esc(r.time||'')+'</span>'+'</div>'+'<div class="d-rate">'+(isUp?Number(r.rate).toFixed(3):r.rate)+'</div>'+'</div>';}box.innerHTML=html;}function tickFormatter(ex){var vals=[];for(var k=0;k<=4;k++)vals.push(ex.max-ex.range*k/4);var rounded=vals.map(function(v){return Math.round(v);});var distinct={};rounded.forEach(function(v){distinct[v]=1;});return Object.keys(distinct).length<2?function(v){return v.toFixed(2);}:function(v){return String(Math.round(v));};}function drawChart(){var canvas=$('trendChart');var ctx=canvas.getContext('2d');var dpr=window.devicePixelRatio||1;var w=canvas.clientWidth||360,h=canvas.clientHeight||300;canvas.width=w*dpr;canvas.height=h*dpr;ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);chartPoints=[];if(!records||records.length===0){ctx.fillStyle='#9aa0aa';ctx.font='13px sans-serif';ctx.textAlign='center';ctx.fillText('暂无记录，点击上方按钮查询后自动记录',w/2,h/2);return;}var groups={unionpay:records.filter(function(r){return r.source==='unionpay';}),myfin:records.filter(function(r){return r.source==='myfin';})};function extent(list){if(!list.length)return null;var vals=list.map(function(r){return r.rate;});var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);if(mn===mx){mn-=0.05;mx+=0.05;}var rg=mx-mn;mn-=rg*0.18;mx+=rg*0.18;return{min:mn,max:mx,range:mx-mn};}var upEx=extent(groups.unionpay),mfEx=extent(groups.myfin);var padL=40,padR=40,padT=22,padB=42;var plotW=w-padL-padR,plotH=h-padT-padB;ctx.strokeStyle='#eef0f3';ctx.lineWidth=1;for(var g=0;g<=4;g++){var gy=padT+plotH*g/4;ctx.beginPath();ctx.moveTo(padL,gy);ctx.lineTo(w-padR,gy);ctx.stroke();}ctx.font='11px sans-serif';if(upEx){var fmtUp=tickFormatter(upEx);ctx.fillStyle='#d4242e';ctx.textAlign='right';for(var i=0;i<=4;i++){var y=padT+plotH*i/4;ctx.fillText(fmtUp(upEx.max-upEx.range*i/4),padL-8,y+4);}}if(mfEx){var fmtMf=tickFormatter(mfEx);ctx.fillStyle='#2563eb';ctx.textAlign='left';for(var j=0;j<=4;j++){var y2=padT+plotH*j/4;ctx.fillText(fmtMf(mfEx.max-mfEx.range*j/4),w-padR+8,y2+4);}}var n=records.length;function xAt(idx){return n===1?padL+plotW/2:padL+plotW*idx/(n-1);}ctx.fillStyle='#9aa0aa';ctx.textAlign='center';var labelIdxs=n===1?[0]:[0,Math.floor((n-1)/2),n-1];labelIdxs.forEach(function(idx){ctx.fillText(dateLabel(records[idx]),xAt(idx),h-14);});function drawLine(list,color,source,ex){if(!list.length|| !ex)return;function yAt(rate){return padT+plotH*(ex.max-rate)/ex.range;}ctx.strokeStyle=color;ctx.lineWidth=2.4;ctx.lineJoin='round';ctx.lineCap='round';ctx.beginPath();list.forEach(function(rec,idx){var gi=records.indexOf(rec);var x=xAt(gi),y=yAt(rec.rate);if(idx===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);});ctx.stroke();ctx.fillStyle=color;list.forEach(function(rec){var gi=records.indexOf(rec);var x=xAt(gi),y=yAt(rec.rate);ctx.beginPath();ctx.arc(x,y,4.5,0,Math.PI*2);ctx.fill();chartPoints.push({x:x,y:y,gi:gi});});}drawLine(groups.unionpay,'#d4242e','unionpay',upEx);drawLine(groups.myfin,'#2563eb','myfin',mfEx);}function dateLabel(rec){var d=rec.date||'';if(/^\d{8}$/.test(d))d=d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6,8);if(d)return String(d).slice(5);var t=String(rec.time||'');return t.slice(0,5)||t;}function focusRecordAt(clientX,clientY){if(!chartPoints.length)return;var rect=$('trendChart').getBoundingClientRect();var mx=clientX-rect.left,my=clientY-rect.top;var best=null,bestDist=20*20;chartPoints.forEach(function(p){var dx=p.x-mx,dy=p.y-my,d=dx*dx+dy*dy;if(d<bestDist){bestDist=d;best=p;}});if(best)highlightRow(best.gi);}function highlightRow(gi){var rows=document.querySelectorAll('.detail-row');for(var i=0;i<rows.length;i++)rows[i].classList.remove('highlight');var row=$('row_'+gi);if(!row)return;row.classList.add('highlight');row.scrollIntoView({behavior:'smooth',block:'center'});}$('trendChart').addEventListener('click',function(e){focusRecordAt(e.clientX,e.clientY);});$('trendChart').addEventListener('touchstart',function(e){if(e.touches&&e.touches.length)focusRecordAt(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});function detectEnv(){if(inApp)return Promise.resolve();return fetch('/api/rate',{method:'GET'}).then(function(r){var ct=r.headers.get('content-type')||'';if(!r.ok||ct.indexOf('application/json')<0)throw new Error('static');return r.json();}).then(function(){isStatic=false;}).catch(function(){isStatic=true;});}detectEnv().then(function(){loadRecords();});window.addEventListener('resize',drawChart);})();</script> </body> </html>
